name: Daily G2B snapshot

on:
  schedule:
    # 09:30 Asia/Seoul. Cron is interpreted as UTC by GitHub Actions.
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      snapshot_date:
        description: "Optional KST date to collect (YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: g2b-daily-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Collect a complete snapshot
        shell: bash
        env:
          SNAPSHOT_DATE: ${{ inputs.snapshot_date }}
        run: |
          if [[ -n "$SNAPSHOT_DATE" ]]; then
            python -m g2b_daily --date "$SNAPSHOT_DATE"
          else
            python -m g2b_daily
          fi

      - name: Commit snapshot
        shell: bash
        run: |
          git add snapshots
          if git diff --cached --quiet; then
            echo "No new snapshot to commit."
            exit 0
          fi
          git config user.name "g2b-daily[bot]"
          git config user.email "g2b-daily[bot]@users.noreply.github.com"
          git commit -m "data: add daily G2B snapshot"
          git push
