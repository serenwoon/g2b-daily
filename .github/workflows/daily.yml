name: Daily G2B snapshot

on:
  schedule:
    # 05:00 Asia/Seoul. Cron is interpreted as UTC by GitHub Actions.
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      snapshot_date:
        description: "Optional KST date to collect (YYYY-MM-DD)"
        required: false
        type: string
      catch_up_days:
        description: "Without a date: fill every missing snapshot in the last N days"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: g2b-daily-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Collect a complete snapshot
        id: collect
        shell: bash
        env:
          SNAPSHOT_DATE: ${{ inputs.snapshot_date }}
          # A scheduled run looks back a week, so a day that failed is picked
          # up by the next run instead of staying missing.
          CATCH_UP_DAYS: ${{ inputs.catch_up_days || '7' }}
        run: |
          if [[ -n "$SNAPSHOT_DATE" ]]; then
            python -m g2b_daily --date "$SNAPSHOT_DATE"
          else
            python -m g2b_daily --catch-up-days "$CATCH_UP_DAYS"
          fi

      # Runs even when collection failed part-way: the dates written before
      # the failure are complete snapshots and are kept. The job stays red.
      - name: Commit snapshot
        if: ${{ !cancelled() && steps.collect.conclusion != 'skipped' }}
        shell: bash
        run: |
          git add snapshots
          if git diff --cached --quiet; then
            echo "No new snapshot to commit."
            exit 0
          fi
          git config user.name "g2b-daily[bot]"
          git config user.email "g2b-daily[bot]@users.noreply.github.com"
          git commit -m "data: add daily G2B snapshot"
          git push
